name: Bob
options:
  bundleIdPrefix: com.anuda
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.6"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  BobCore:
    path: .
targets:
  Bob:
    type: application
    platform: iOS
    sources:
      - path: Bob
        excludes:
          - "**/*.md"
    info:
      path: Bob/Info.plist
      properties:
        CFBundleDisplayName: Bob
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Bob uses the camera to verify pushup activity or scan your registered QR code. Video is never saved.
        NSAlarmKitUsageDescription: Bob sounds your wake-up alarm and bounded reminders until you complete your morning challenge.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    dependencies:
      - package: BobCore
        product: BobCore
      - package: BobCore
        product: BobPlan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anuda.bob
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  BobUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [BobUITests]
    dependencies:
      - target: Bob
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anuda.bob.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Bob:
    build:
      targets:
        Bob: all
    test:
      targets: [BobUITests]
      gatherCoverageData: true
